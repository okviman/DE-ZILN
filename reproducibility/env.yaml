name: de-ziln-reproducibility
channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  - python=3.11
  - numpy
  - scipy<1.16
  - statsmodels
  - pandas
  - scanpy
  - scikit-learn
  - matplotlib
  - jupyter
  - ipykernel
  - r-base>=4.3
  - rpy2>=3.5
  - anndata2ri>=1.3
  - bioconductor-mast
  - bioconductor-edger
  - filelock
  - pip
  - pip:
      - decoupler
      - leidenalg
      - pertpy